name: Deploy Backend to Hugging Face

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hf-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.26.0"

      - name: Upload backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ HF_TOKEN secret is not configured."
            exit 1
          fi

          python << 'PYEOF'
          import os
          import sys
          from huggingface_hub import HfApi
          from huggingface_hub.errors import RepositoryNotFoundError

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ.get("HF_SPACE_REPO") or "benjamin5607/my-fortune-project"

          api = HfApi(token=token)
          who = api.whoami()
          username = who.get("name") or who.get("fullname", "unknown")
          print(f"✅ Hugging Face login: {username}")
          print(f"📦 Target Space: {repo_id}")

          owner = repo_id.split("/")[0]
          if username.lower() != owner.lower():
              print(f"⚠️  Token user '{username}' != Space owner '{owner}'")
              print("   Ensure HF_TOKEN belongs to the Space owner account.")

          try:
              api.space_info(repo_id)
              print(f"✅ Space found: {repo_id}")
          except RepositoryNotFoundError:
              print(f"⚠️  Space not found. Creating {repo_id} ...")
              api.create_repo(
                  repo_id=repo_id,
                  repo_type="space",
                  space_sdk="docker",
                  exist_ok=True,
              )

          api.upload_folder(
              folder_path="backend",
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy Emily Pantheon backend from GitHub Actions",
              ignore_patterns=["**/__pycache__/**", "**/*.pyc"],
          )
          print(f"✅ Backend uploaded to https://huggingface.co/spaces/{repo_id}")
          PYEOF
