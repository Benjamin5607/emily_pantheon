name: Deploy Backend to Hugging Face

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hf-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to Hugging Face Space (git)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ HF_TOKEN secret is not configured."
            exit 1
          fi

          REPO_ID="${HF_SPACE_REPO:-benjamin5607/my-fortune-project}"
          OWNER="${REPO_ID%%/*}"
          SPACE_NAME="${REPO_ID#*/}"

          echo "📦 Deploying to Space: $REPO_ID"

          git clone "https://${OWNER}:${HF_TOKEN}@huggingface.co/spaces/${REPO_ID}" hf-space

          rsync -av --delete \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            backend/ hf-space/

          cd hf-space
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          if [ -z "$(git status --porcelain)" ]; then
            echo "ℹ️ No file changes to deploy."
            exit 0
          fi

          git add -A
          git commit -m "Deploy Emily Pantheon backend from GitHub Actions"
          git push origin main

          echo "✅ Pushed to https://huggingface.co/spaces/${REPO_ID}"
          echo "🔄 Space will rebuild automatically (Docker)."
